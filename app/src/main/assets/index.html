<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>myHub · 설정</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0E1116; --panel:#161B22; --panel-2:#1B212B; --line:#242C38;
    --ink:#E8ECF3; --muted:#7C8696; --faint:#566072;
    --accent:#2DD4BF; --accent-ink:#06231F;
    --danger:#F472A6;
    --shadow:0 18px 40px -22px rgba(0,0,0,.8);
    --r:18px;
    --safe-top:env(safe-area-inset-top,0px);
    --safe-bot:env(safe-area-inset-bottom,0px);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:"Sora",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
    position:relative;
    min-height:100%;
  }
  /* atmospheric background */
  body::before{
    content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
    background:
      radial-gradient(60% 45% at 82% -8%, rgba(45,212,191,.16), transparent 60%),
      radial-gradient(55% 40% at -10% 8%, rgba(99,102,241,.12), transparent 60%),
      radial-gradient(40% 30% at 50% 110%, rgba(244,114,166,.07), transparent 60%);
  }
  body::after{
    content:"";position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.035;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
  }
  .wrap{position:relative;z-index:1;max-width:560px;margin:0 auto;padding:0 18px calc(40px + var(--safe-bot))}

  /* top bar */
  .bar{
    position:sticky;top:0;z-index:5;
    display:flex;align-items:center;gap:10px;
    padding:calc(12px + var(--safe-top)) 2px 12px;
    background:linear-gradient(var(--bg) 72%, rgba(14,17,22,0));
  }
  .icbtn{
    width:42px;height:42px;flex:0 0 auto;border:none;cursor:pointer;
    border-radius:13px;background:var(--panel);color:var(--ink);
    border:1px solid var(--line);display:grid;place-items:center;
    font-size:18px;transition:transform .12s ease, background .15s ease;
  }
  .icbtn:active{transform:scale(.93);background:var(--panel-2)}
  .bar h1{
    flex:1;margin:0;font-size:16px;font-weight:600;letter-spacing:.3px;
    display:flex;align-items:center;gap:9px;
  }
  .dot{width:9px;height:9px;border-radius:50%;background:var(--accent);
    box-shadow:0 0 0 4px rgba(45,212,191,.15)}
  .ver{font:500 11px "IBM Plex Mono",monospace;color:var(--faint);
    border:1px solid var(--line);padding:4px 8px;border-radius:9px}

  /* hero */
  .hero{padding:14px 4px 18px}
  .hero .k{font:500 12px "IBM Plex Mono",monospace;letter-spacing:2px;
    text-transform:uppercase;color:var(--accent)}
  .hero h2{margin:6px 0 0;font-size:30px;font-weight:700;letter-spacing:-.5px;line-height:1.08}
  .hero p{margin:8px 0 0;color:var(--muted);font-size:13.5px;line-height:1.5}

  /* list */
  .list{display:flex;flex-direction:column;gap:12px}
  .card{
    position:relative;display:flex;align-items:stretch;gap:0;
    background:var(--panel);border:1px solid var(--line);
    border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow);
    animation:rise .45s cubic-bezier(.2,.7,.2,1) both;
  }
  @keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  .stripe{width:5px;flex:0 0 auto;background:var(--accent)}
  .card .body{flex:1;min-width:0;padding:14px 12px 14px 14px}
  .idx{font:500 11px "IBM Plex Mono",monospace;color:var(--faint)}
  .card .lab{margin:2px 0 3px;font-size:16px;font-weight:600;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .card .url{font:400 12.5px "IBM Plex Mono",monospace;color:var(--muted);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ctrls{display:flex;flex-direction:column;justify-content:center;gap:6px;
    padding:8px 10px 8px 4px}
  .crow{display:flex;gap:6px}
  .mini{
    width:32px;height:32px;border:1px solid var(--line);background:var(--panel-2);
    color:var(--muted);border-radius:9px;cursor:pointer;font-size:14px;
    display:grid;place-items:center;transition:.12s;
  }
  .mini:active{transform:scale(.9)}
  .mini.edit{color:var(--accent)}
  .mini.del{color:var(--danger)}
  .mini[disabled]{opacity:.28;pointer-events:none}

  /* add button */
  .add{
    margin-top:14px;width:100%;padding:16px;cursor:pointer;
    background:transparent;color:var(--accent);
    border:1.5px dashed rgba(45,212,191,.42);border-radius:var(--r);
    font:600 14.5px "Sora",sans-serif;letter-spacing:.2px;
    display:flex;align-items:center;justify-content:center;gap:8px;
    transition:.15s;
  }
  .add:active{background:rgba(45,212,191,.07)}

  /* empty */
  .empty{text-align:center;padding:46px 20px;color:var(--muted)}
  .empty .big{font-size:54px;color:var(--accent);line-height:1}
  .empty h3{margin:14px 0 6px;color:var(--ink);font-size:18px}
  .empty p{margin:0;font-size:13.5px}

  /* footer hint */
  .hint{margin-top:26px;padding:14px 16px;border-radius:14px;
    background:var(--panel);border:1px solid var(--line);
    color:var(--faint);font-size:12px;line-height:1.6}
  .hint b{color:var(--muted);font-weight:600}

  /* bottom sheet */
  .scrim{position:fixed;inset:0;z-index:20;background:rgba(4,6,10,.62);
    backdrop-filter:blur(3px);opacity:0;pointer-events:none;transition:opacity .25s}
  .scrim.on{opacity:1;pointer-events:auto}
  .sheet{
    position:fixed;left:0;right:0;bottom:0;z-index:21;
    background:var(--panel);border-top-left-radius:24px;border-top-right-radius:24px;
    border:1px solid var(--line);border-bottom:none;
    padding:10px 20px calc(22px + var(--safe-bot));
    transform:translateY(102%);transition:transform .32s cubic-bezier(.2,.8,.2,1);
    max-width:560px;margin:0 auto;box-shadow:0 -20px 50px -20px rgba(0,0,0,.7)}
  .sheet.on{transform:none}
  .grab{width:42px;height:4px;border-radius:3px;background:var(--line);margin:6px auto 14px}
  .sheet h3{margin:0 0 16px;font-size:19px;font-weight:700;letter-spacing:-.3px}
  .field{margin-bottom:14px}
  .field label{display:block;font-size:12px;color:var(--muted);margin:0 0 7px;
    letter-spacing:.3px;font-weight:500}
  .field input{
    width:100%;padding:13px 14px;background:var(--bg);color:var(--ink);
    border:1px solid var(--line);border-radius:12px;font-size:15px;
    font-family:inherit;outline:none;transition:border .15s, box-shadow .15s;
  }
  .field input::placeholder{color:var(--faint)}
  .field input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(45,212,191,.16)}
  .field input.mono{font-family:"IBM Plex Mono",monospace;font-size:13.5px}
  .swatches{display:flex;gap:10px;flex-wrap:wrap;margin-top:2px}
  .sw{width:30px;height:30px;border-radius:50%;cursor:pointer;border:2px solid transparent;
    transition:transform .12s}
  .sw:active{transform:scale(.88)}
  .sw.sel{border-color:var(--ink);box-shadow:0 0 0 3px rgba(232,236,243,.12)}
  .err{color:var(--danger);font-size:12px;margin-top:-6px;margin-bottom:10px;display:none}
  .err.on{display:block}
  .actions{display:flex;gap:10px;margin-top:8px}
  .btn{flex:1;padding:14px;border-radius:13px;border:1px solid var(--line);
    cursor:pointer;font:600 15px "Sora",sans-serif;transition:.13s}
  .btn:active{transform:scale(.98)}
  .btn.ghost{background:transparent;color:var(--muted)}
  .btn.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent}
</style>
</head>
<body>
  <div class="wrap">
    <div class="bar">
      <button class="icbtn" id="back" aria-label="뒤로">←</button>
      <h1><span class="dot"></span> 페이지 설정</h1>
      <span class="ver" id="ver">v1.0.0</span>
    </div>

    <div class="hero">
      <div class="k">myHub</div>
      <h2>내 페이지</h2>
      <p>보고 싶은 URL을 추가하세요. 여러 개를 넣으면 메인에서 <b style="color:var(--ink)">좌우로 스와이프</b>하며 전환됩니다. 첫 번째 항목이 앱의 첫 화면이 됩니다.</p>
    </div>

    <div class="list" id="list"></div>

    <button class="add" id="add">＋ 새 페이지 추가</button>

    <div class="hint">
      <b>로그인이 필요한 사이트</b>는 페이지에서 그대로 로그인하면 됩니다 — 세션/쿠키가 기기에 안전하게 유지되어 다음에도 로그인 상태로 열립니다.<br>
      ※ 구글 계정 등 일부 OAuth 제공자는 보안 정책상 인앱 화면 로그인을 차단할 수 있습니다.
    </div>
  </div>

  <!-- bottom sheet -->
  <div class="scrim" id="scrim"></div>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true">
    <div class="grab"></div>
    <h3 id="sheetTitle">새 페이지</h3>
    <div class="field">
      <label for="f-label">이름</label>
      <input id="f-label" type="text" placeholder="예: 회사 인트라넷" maxlength="40" autocomplete="off" />
    </div>
    <div class="field">
      <label for="f-url">URL</label>
      <input id="f-url" class="mono" type="url" inputmode="url" placeholder="example.com" autocapitalize="off" autocomplete="off" spellcheck="false" />
    </div>
    <div class="err" id="err">올바른 URL을 입력해 주세요.</div>
    <div class="field">
      <label>색상</label>
      <div class="swatches" id="swatches"></div>
    </div>
    <div class="actions">
      <button class="btn ghost" id="cancel">취소</button>
      <button class="btn primary" id="save">저장</button>
    </div>
  </div>

<script>
(function(){
  "use strict";

  var COLORS = ["#2DD4BF","#60A5FA","#A78BFA","#F472A6","#FBBF24","#34D399","#F87171","#38BDF8"];
  var N = window.Native || null;

  var state = [];      // [{id,label,url,color}]
  var editingId = null;
  var pickedColor = COLORS[0];

  var el = function(id){ return document.getElementById(id); };

  function uid(){ return "s" + Date.now().toString(36) + Math.floor(Math.random()*1e4).toString(36); }

  function normUrl(raw){
    var u = (raw||"").trim();
    if(!u) return "";
    if(!/^https?:\/\//i.test(u)) u = "https://" + u;
    return u;
  }
  function validUrl(raw){
    var u = normUrl(raw);
    return /^https?:\/\/[^\s.]+\.[^\s]+/i.test(u) || /^https?:\/\/localhost(:\d+)?/i.test(u);
  }
  function hostOf(raw){
    var u = normUrl(raw);
    return u.replace(/^https?:\/\//i,"").replace(/\/.*$/,"");
  }
  function esc(s){
    return (s||"").replace(/[&<>"']/g, function(c){
      return ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"})[c];
    });
  }

  function load(){
    var raw = "[]";
    try { raw = N ? N.getConfig() : (window.__demo || "[]"); } catch(e){ raw = "[]"; }
    try { state = JSON.parse(raw) || []; } catch(e){ state = []; }
    if(!Array.isArray(state)) state = [];
  }
  function persist(){
    var json = JSON.stringify(state);
    try { if(N) N.saveConfig(json); } catch(e){}
    window.__demo = json;
  }

  function render(){
    var list = el("list");
    if(!state.length){
      list.innerHTML =
        '<div class="empty">'+
          '<div class="big">◧</div>'+
          '<h3>등록된 페이지가 없어요</h3>'+
          '<p>아래 버튼으로 첫 페이지를 추가해 보세요.</p>'+
        '</div>';
      return;
    }
    var html = "";
    for(var i=0;i<state.length;i++){
      var s = state[i];
      html +=
        '<div class="card" style="animation-delay:'+(i*45)+'ms">'+
          '<div class="stripe" style="background:'+esc(s.color||COLORS[0])+'"></div>'+
          '<div class="body" data-edit="'+esc(s.id)+'">'+
            '<div class="idx">'+(i===0?"첫 화면":("# "+(i+1)))+'</div>'+
            '<div class="lab">'+esc(s.label||hostOf(s.url))+'</div>'+
            '<div class="url">'+esc(hostOf(s.url))+'</div>'+
          '</div>'+
          '<div class="ctrls">'+
            '<div class="crow">'+
              '<button class="mini up" data-up="'+i+'" '+(i===0?"disabled":"")+' aria-label="위로">↑</button>'+
              '<button class="mini down" data-down="'+i+'" '+(i===state.length-1?"disabled":"")+' aria-label="아래로">↓</button>'+
            '</div>'+
            '<div class="crow">'+
              '<button class="mini edit" data-edit="'+esc(s.id)+'" aria-label="편집">✎</button>'+
              '<button class="mini del" data-del="'+esc(s.id)+'" aria-label="삭제">✕</button>'+
            '</div>'+
          '</div>'+
        '</div>';
    }
    list.innerHTML = html;
  }

  // ---- sheet ----
  function buildSwatches(){
    var box = el("swatches"); box.innerHTML = "";
    COLORS.forEach(function(c){
      var d = document.createElement("div");
      d.className = "sw" + (c===pickedColor ? " sel":"");
      d.style.background = c;
      d.setAttribute("data-color", c);
      box.appendChild(d);
    });
  }
  function openSheet(entry){
    editingId = entry ? entry.id : null;
    el("sheetTitle").textContent = entry ? "페이지 편집" : "새 페이지";
    el("f-label").value = entry ? (entry.label||"") : "";
    el("f-url").value = entry ? (entry.url||"") : "";
    pickedColor = entry ? (entry.color||COLORS[0]) : COLORS[state.length % COLORS.length];
    el("err").classList.remove("on");
    buildSwatches();
    el("scrim").classList.add("on");
    el("sheet").classList.add("on");
    setTimeout(function(){ if(!entry) el("f-label").focus(); }, 280);
  }
  function closeSheet(){
    el("scrim").classList.remove("on");
    el("sheet").classList.remove("on");
    if(document.activeElement && document.activeElement.blur) document.activeElement.blur();
  }
  function saveSheet(){
    var label = el("f-label").value.trim();
    var url = el("f-url").value.trim();
    if(!validUrl(url)){ el("err").classList.add("on"); return; }
    url = normUrl(url);
    if(!label) label = hostOf(url);
    if(editingId){
      for(var i=0;i<state.length;i++){
        if(state[i].id===editingId){ state[i].label=label; state[i].url=url; state[i].color=pickedColor; break; }
      }
    } else {
      state.push({ id:uid(), label:label, url:url, color:pickedColor });
    }
    persist(); render(); closeSheet();
  }

  function move(from,to){
    if(to<0||to>=state.length) return;
    var x = state.splice(from,1)[0];
    state.splice(to,0,x);
    persist(); render();
  }
  function remove(id){
    state = state.filter(function(s){ return s.id!==id; });
    persist(); render();
  }
  function findById(id){
    for(var i=0;i<state.length;i++){ if(state[i].id===id) return state[i]; }
    return null;
  }

  // ---- events ----
  el("add").addEventListener("click", function(){ openSheet(null); });
  el("cancel").addEventListener("click", closeSheet);
  el("scrim").addEventListener("click", closeSheet);
  el("save").addEventListener("click", saveSheet);
  el("back").addEventListener("click", function(){
    try { if(N) N.close(); } catch(e){}
  });

  el("swatches").addEventListener("click", function(e){
    var c = e.target.getAttribute("data-color");
    if(!c) return;
    pickedColor = c; buildSwatches();
  });

  el("list").addEventListener("click", function(e){
    var t = e.target;
    var up = t.getAttribute("data-up");
    var dn = t.getAttribute("data-down");
    var ed = t.getAttribute("data-edit");
    var dl = t.getAttribute("data-del");
    if(up!==null){ move(parseInt(up,10), parseInt(up,10)-1); return; }
    if(dn!==null){ move(parseInt(dn,10), parseInt(dn,10)+1); return; }
    if(dl){ remove(dl); return; }
    if(ed){ var s=findById(ed); if(s) openSheet(s); return; }
  });

  el("f-url").addEventListener("keydown", function(e){
    if(e.key==="Enter"){ e.preventDefault(); saveSheet(); }
  });

  // version from native if available
  try { if(N && N.appVersion) el("ver").textContent = "v" + N.appVersion(); } catch(e){}

  load();
  render();
})();
</script>
</body>
</html>
